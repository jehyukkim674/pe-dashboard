name: Release

# v* 태그를 푸시하면 macOS(arm64)에서 빌드해 GitHub Release에 업로드한다.
# 사용: electron/package.json 버전 업 커밋 → git tag vX.Y.Z && git push origin vX.Y.Z
on:
  push:
    tags: ['v*']

jobs:
  build-release:
    runs-on: macos-14 # arm64
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run app:build
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            electron/release/*-mac.zip \
            electron/release/*-mac.zip.blockmap \
            electron/release/latest-mac.yml \
            --title "$GITHUB_REF_NAME" --generate-notes

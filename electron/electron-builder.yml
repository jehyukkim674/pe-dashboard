appId: com.gimjaehyeog.pe-dashboard
productName: PE Dashboard
artifactName: "PE-Dashboard-${version}-${arch}-mac.${ext}"
directories:
  output: release
files:
  - dist/**
  - package.json
extraResources:
  - from: ../web/dist
    to: web
mac:
  category: public.app-category.developer-tools
  target:
    - target: zip      # 자동 업데이트용 (필수)
      arch: [arm64]
publish:
  provider: github
  owner: jehyukkim674
  repo: pe-dashboard
